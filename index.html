<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/javascript.js" defer></script>
    <title>Iniciar sesi&oacute;n</title>
</head>
<body>
    <main class="login-page">
        <section class="login-card" aria-labelledby="login-title">
            <div class="brand-mark" aria-hidden="true">W</div>
            <p class="eyebrow">Bienvenido de nuevo</p>
            <h1 id="login-title">Inicia sesi&oacute;n</h1>
            <p class="intro">Accede a tu cuenta para continuar.</p>

            <form id="login-form" novalidate>
                <div class="field-group">
                    <label for="email">Correo electr&oacute;nico</label>
                    <input id="email" name="email" type="email" autocomplete="email" placeholder="tu@correo.com" required>
                    <small class="field-error" data-error-for="email"></small>
                </div>

                <div class="field-group">
                    <div class="password-label">
                        <label for="password">Contrase&ntilde;a</label>
                        <a href="#">&iquest;La olvidaste?</a>
                    </div>
                    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Escribe tu contrase&ntilde;a" required minlength="6">
                    <small class="field-error" data-error-for="password"></small>
                </div>

                <label class="remember-me">
                    <input type="checkbox" name="remember">
                    <span>Recordarme en este dispositivo</span>
                </label>

                <button type="submit">Entrar</button>
                <p class="form-message" role="status" aria-live="polite"></p>
            </form>

            <p class="signup">&iquest;A&uacute;n no tienes una cuenta? <a href="#">Reg&iacute;strate</a></p>
        </section>
    </main>
</body>
</html>
